# Generic Oracle sqlfluff configuration.
#
# Used by conform.nvim (SECTION 6 of init.lua) as the DEFAULT sqlfluff config
# for `sql` buffers, so formatting behaves consistently in any repo whether or
# not that repo ships its own .sqlfluff.
#
# The only thing this really has to do is override sqlfluff's default
# `ansi` dialect, which cannot parse Oracle at all. Indentation is left at
# sqlfluff's default (4) -- house-style overrides belong in a site-specific
# config rather than here. To use one, have the gitignored machine-local
# module (lua/machine.lua) set vim.g.sqlfluff_config to its path; conform
# reads that variable and falls back to this file when it is unset.
#
# If a project you work in grows its own .sqlfluff and you would rather it
# win, drop the `--config` argument from the sqlfluff entry in init.lua.

[sqlfluff]
dialect = oracle
max_line_length = 120

# Keep the formatter conservative: it should tidy layout, not rewrite code.
# Capitalisation rules are excluded because enforcing a keyword-case policy
# across an existing codebase produces enormous, review-hostile diffs.
exclude_rules = capitalisation.keywords, capitalisation.identifiers, capitalisation.functions, capitalisation.literals, capitalisation.types

[sqlfluff:indentation]
indent_unit = space
indented_joins = false
indented_using_on = true
# NOTE: this key replaced the older `allow_implicit_indents`, which sqlfluff
# 4.x still accepts but warns about on every run -- and that warning lands on
# stderr, where conform surfaces it as a format error.
implicit_indents = allow

[sqlfluff:layout:type:comma]
line_position = trailing
